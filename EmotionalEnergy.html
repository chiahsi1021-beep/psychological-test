<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"  content="width=device-width, initial-scale=1.0">
  <title>EmotionalEnergy</title>
  <link rel="stylesheet" href="css/EmotionalEnergy.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
  <nav class="navbar">
      <div class="logo">
        <img src="image/logo.png" alt="Logo">
      </div>
    <div class="lab-title">人格宇宙研究室</div>
  </nav>

  <main class="main-container">

    <section class="card-section">

      <div class="card-header">
        <h1 class="card-title">此刻的感情能量場</h1>
      </div>

      <p class="card-subtitle">看見你在關係中的內在狀態</p>

        <div class="card-display" id="mainCard">
          
            <div class="card-inner">
              <div class="card-back">
                <img src="image/CardB_backSide_fixed.png" alt="卡牌背面" class="card-image">
              </div>
            </div>
          </div>


      <div class="button-group">
        <button class="btn btn-draw">點我洗牌</button>
      </div>

    </section>
  </main>

  <script src="js/EmotionalEnergy.js"></script>

</html>
