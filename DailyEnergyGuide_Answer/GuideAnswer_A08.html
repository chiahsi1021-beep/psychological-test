<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyEnergyGuide</title>
  <link rel="stylesheet" href="../css/GuideAnswer_A.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
  <nav class="navbar">
      <div class="logo">
        <img src="../image/logo.png" alt="Logo">
      </div>
    <div class="lab-title">人格宇宙研究室</div>
  </nav>

  <main class="main-container">

    <section class="card-section">

      <div class="card-header">
        <h1 class="card-title">每日能量指引</h1>
      </div>

      <p class="card-subtitle">抽一張，接收此刻的指引</p>

        <div class="card-display" onclick="flipCard(this)">
          
            <div class="card-inner">
              <div class="card-front" style="--hue-setting: 160deg; --sub-glow-color: #FF5353;">
                <h3 class="front-title" style="color: #FF5353;">設立界線</h3>
                <div class="vertical-text">
                  保護自己，並不是自私。
                </div>
              </div>
              <div class="card-back">
                <img src="../image/Card_backSide_fixed.png" alt="卡牌背面" class="card-image">
              </div>
            </div>
          </div>

        <div class="card-footer">
          <span class="leaf-icon"><img src="../image/CardA_Icon02.png"></span>
          <p class="card-footer-text">小行動：先照顧好心，才有力氣愛。</p>
        </div>

      <div class="button-group">
        <button id="btnShare" class="btn btn-share">分享結果</button>
        <a href="../Home/Home.html" class="btn btn-home">回首頁</a>
      </div>

    </section>
  </main>

  <script src="../js/GuideAnswer_A.js"></script>
</body>

</html>
