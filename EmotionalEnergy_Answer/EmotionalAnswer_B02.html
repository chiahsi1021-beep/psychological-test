<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmotionalEnergy</title>
  <link rel="stylesheet" href="../css/EmotionalEnergy_Answer.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
  <nav class="navbar">
      <div class="logo">
        <img src="../image/logo.png" alt="Logo">
      </div>
    <div class="lab-title">人格宇宙研究室</div>
  </nav>

  <main class="main-container">

    <section class="card-section" style="background-color: #5B6C9DCC">

      <div class="card-header">
        <h1 class="card-title">此刻的感情能量場</h1>
      </div> 

      <p class="card-subtitle" style="color: #ecc9ff;">看見你在關係中的內在狀態 </p>

        <div class="card-display" onclick="flipCard(this)">
          
            <div class="card-inner">
              <div class="card-front" style="--hue-setting: -30deg; --sub-glow-color: #ffffff;">
                <h2 class="front-title" style="color: #ffffff;">
                  <img src="../image/CardB_Icon07.png" class="title-icon" alt="icon">
                  <span>安    全 </span></h2>
                 <div class="vertical-text">
                  真正的靠近，不會讓你害怕。
                </div>  
              </div>
              <div class="card-back">
                <img src="../image/CardB_backSide_fixed.png" alt="卡牌背面" class="card-image">
              </div>
            </div>
          </div>

        <div class="card-footer">
          <span class="leaf-icon"><img src="../image/CardB_Icon00.png"></span>
          <p class="card-footer-text">小行動： 待在讓你安心的人身邊。 </p> 
        </div>

      <div class="button-group">
        <a href="https://www.instagram.com/" class="btn btn-share" target="_blank">分享結果</a>
        <a href="../index.html" class="btn btn-home">回首頁</a>
      </div>

    </section>
  </main>

  <script src="../js/EmotionalEnergy_Answer.js"></script>
</body>

</html>
