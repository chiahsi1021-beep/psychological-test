<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"  content="width=device-width, initial-scale=1.0">
  <title>FeelingEnergy</title>
  <link rel="stylesheet" href="css/FeelingEnergy.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
  <nav class="navbar">
      <div class="logo">
        <img src="image/logo.png" alt="Logo">
      </div>
    <div class="lab-title">人格宇宙研究室</div>
  </nav>

  <main class="main-container">

    <section class="card-section">

      <div class="card-header">
        <h1 class="card-title">情緒能量卡</h1>
      </div>

      <p class="card-subtitle">抽一張，看看你此刻最需要的情緒能量</p>

        <div class="card-display" id="mainCard">
          
            <div class="card-inner">
              <div class="card-back">
                <img src="image/CardC_backSide_fixed.png" alt="卡牌背面" class="card-image">
              </div>
            </div>
          </div>


      <div class="button-group">
        <button class="btn btn-draw">點我洗牌</button>
      </div>

    </section>
  </main>

      <footer id="footer" class="info-bar">
     <div class="footer-content">
         <p>探索心靈的深處，找回內在的平靜與力量</p>
         <h6>本網站內容僅供自我探索與情緒覺察之用，非專業心理諮詢或醫療建議。</h6>
        <div class="footer-links">
           <span>關於我們</span> | <span>隱私條款</span> | <span>聯繫窗口</span>
        </div>               
      </div>
    </footer>


  <script src="js/FeelingEnergy.js"></script>
</body>

</html>
