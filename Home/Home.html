<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="你的潛意識目前在提醒你什麼？探索你的情感運作模式與能量場。">
    <title>心理測驗實驗室 | 潛意識與能量指引</title>
    <link rel="stylesheet" href="Home.css">S
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;700&family=Noto+Sans+TC:wght@300;400;700&family=Inter:wght@300;400&family=Noto+Sans+Thai:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-wrapper">
        <!-- Logo Section -->
        <div id="logo-section" class="logo-container">
            <div class="logo-placeholder">
                <span class="logo-text">PSYCHOLOGY</span>
                <span class="logo-subtext">EXPERIMENT LAB</span>
            </div>
        </div>

        <!-- Hero Section (Upper Large Image) -->
        <div id="hero-section" class="hero-image-container">
            <img src="image/圖 (1).png" alt="Hero Background" class="hero-image">
        </div>

        <!-- Psychological Test Lab Lab (Title Outer Box) -->
        <div id="test-lab-header" class="test-lab-outer">
            <h2>心理測驗實驗室</h2>
        </div>

        <!-- Psychological Test Section -->
        <section class="test-section">
            <!-- Item 1 -->
            <div class="test-card item-subconscious">
                <div class="card-pic pic-subconscious"></div>
                <div class="card-title title-subconscious">你的潛意識目前在提醒你什麼</div>
            </div>

            <!-- Item 2 -->
            <div class="test-card item-emotional">
                <div class="card-pic pic-emotional"></div>
                <div class="card-title title-emotional">你的情感運作模式是哪一種？</div>
            </div>

            <!-- Item 3 -->
            <div class="test-card item-stress">
                <div class="card-pic pic-stress"></div>
                <div class="card-title title-stress">你的壓力能量主要來自哪裡？</div>
            </div>
        </section>

        <!-- Draw Card Section Header -->
        <div id="draw-card-header" class="draw-card-outer">
            <h2>抽卡牌底區</h2>
        </div>

        <!-- Card Drawing Section -->
        <section class="card-section">
            <!-- Card 1 -->
            <div class="draw-item card-energy">
                <div class="draw-pic pic-energy"></div>
                <div class="draw-title title-energy">今日能量指引</div>
            </div>

            <!-- Card 2 -->
            <div class="draw-item card-field">
                <div class="draw-pic pic-field"></div>
                <div class="draw-title title-field">此刻的感情能量場</div>
            </div>

            <!-- Card 3 -->
            <div class="draw-item card-healing">
                <div class="draw-pic pic-healing"></div>
                <div class="draw-title title-healing">情緒療癒卡</div>
            </div>
        </section>

        <!-- Information Bar (Footer) -->
        <footer id="footer" class="info-bar">
            <div class="footer-content">
                <p>探索心靈的深處，找回內在的平靜與力量</p>
                <div class="footer-links">
                    <span>關於我們</span> | <span>隱私條款</span> | <span>聯繫窗口</span>
                </div>
            </div>
        </footer>
    </div>
</body>
</html>
